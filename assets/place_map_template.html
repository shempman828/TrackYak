<!DOCTYPE html>
<html>
<head>
    <title>Places Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc="
        crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
        integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
            integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg="
            crossorigin=""></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --accent-color: #8599ea;
            --accent-hover: #a4b3ff;
            --accent-transparent: rgba(133, 153, 234, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2d2d2d;
        }
        #map {
            height: 100vh;
            width: 100%;
            background-color: #1e1e1e;
        }

        /* Tint the basemap only, so marker colors match the legend */
        .leaflet-tile-pane {
            filter: hue-rotate(10deg) brightness(1.1) saturate(1.2);
        }

        /* Shown in place of the map when Leaflet cannot load (offline) */
        .map-load-error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0 24px;
            box-sizing: border-box;
            text-align: center;
            color: var(--accent-color);
            font-family: Arial, sans-serif;
        }

        /* Dark mode popup styling with accent color */
        .leaflet-popup-content-wrapper {
            background-color: #2d2d2d;
            color: var(--accent-color);
            border-radius: 8px;
            border: 1px solid var(--accent-transparent);
        }

        .leaflet-popup-content {
            color: var(--accent-color);
            font-family: Arial, sans-serif;
            line-height: 1.4;
            margin: 12px 16px;
        }

        .leaflet-popup-tip {
            background-color: #2d2d2d;
            border: 1px solid var(--accent-transparent);
        }

        /* Enhanced popup header */
        .leaflet-popup-content-wrapper h3 {
            color: var(--accent-color);
            margin-top: 0;
            border-bottom: 1px solid var(--accent-transparent);
            padding-bottom: 5px;
        }

        /* Tooltip styling */
        .leaflet-tooltip {
            background-color: #2d2d2d;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 4px;
        }

        .leaflet-tooltip-top:before { border-top-color: var(--accent-color); }
        .leaflet-tooltip-bottom:before { border-bottom-color: var(--accent-color); }
        .leaflet-tooltip-left:before { border-left-color: var(--accent-color); }
        .leaflet-tooltip-right:before { border-right-color: var(--accent-color); }

        /* Custom marker styling with accent border */
        .custom-div-icon {
            background: transparent;
            border: none;
        }

        /* Cluster bubbles tinted to match the theme accent color */
        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background-color: rgba(133, 153, 234, 0.35);
        }
        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background-color: rgba(133, 153, 234, 0.75);
            color: #ffffff;
        }

        /* Enhanced zoom controls */
        .leaflet-control-zoom a {
            background-color: #2d2d2d;
            color: var(--accent-color);
            border: 1px solid var(--accent-transparent);
            border-bottom: 1px solid var(--accent-transparent);
        }

        .leaflet-control-zoom a:hover {
            background-color: var(--accent-transparent);
            color: var(--accent-hover);
            border-color: var(--accent-color);
        }

        /* Attribution styling */
        .leaflet-control-attribution {
            background-color: rgba(45, 45, 45, 0.9) !important;
            color: var(--accent-color) !important;
            font-size: 11px;
            border-top: 1px solid var(--accent-transparent);
            border-right: 1px solid var(--accent-transparent);
        }

        .leaflet-control-attribution a {
            color: var(--accent-color) !important;
        }

        .leaflet-control-attribution a:hover {
            color: var(--accent-hover) !important;
        }

        /* Custom scrollbar for popups */
        .leaflet-popup-content-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .leaflet-popup-content-wrapper::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        .leaflet-popup-content-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        .leaflet-popup-content-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // qt is undefined outside Qt WebEngine (e.g. a plain browser)
        if (typeof qt !== 'undefined' && typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                window.pyBridge = channel.objects.pyBridge;
            });
        }

        function sendToPy(type, placeId) {
            if (window.pyBridge) {
                window.pyBridge.handle_js_message(JSON.stringify({ type: type, placeId: placeId }));
            } else {
                console.error('WebChannel not initialized');
            }
        }

        // Popup button handlers
        window.viewAssociations = function(placeId) { sendToPy('viewAssociations', placeId); };
        window.showInList = function(placeId) { sendToPy('showInList', placeId); };

        if (typeof L === 'undefined' || typeof L.markerClusterGroup === 'undefined') {
            var mapDiv = document.getElementById('map');
            mapDiv.className = 'map-load-error';
            mapDiv.textContent = 'The map library could not load. Check the internet connection, then open the Places page again.';
            throw new Error('Leaflet not loaded');
        }

        // worldCopyJump keeps markers visible when panning onto a repeated world copy
        var map = L.map('map', { worldCopyJump: true }).setView([{center_lat}, {center_lon}], {zoom});

        // Keyless Esri Dark Gray base + label overlay; upscale past native z16 instead of requesting blank tiles
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 18,
            maxNativeZoom: 16
        }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            maxNativeZoom: 16,
            zIndex: 2
        }).addTo(map);

        // Cluster markers so large place counts pan and zoom smoothly
        var markerClusterGroup = L.markerClusterGroup({
            maxClusterRadius: {cluster_radius},
            disableClusteringAtZoom: {cluster_disable_zoom},
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        });

        // Add markers
        {markers_js}
        map.addLayer(markerClusterGroup);

        // Fit bounds to show all markers if we have any
        {bounds_js}
    </script>
</body>
</html>
