  <rect x="30" y="80" width="20" height="60" fill="#99ea85" />
  <rect x="70" y="60" width="20" height="80" fill="#99ea85" />
  <rect x="110" y="40" width="20" height="100" fill="#99ea85" />
  <rect x="150" y="20" width="20" height="120" fill="#99ea85" />

  <line x1="20" y1="140" x2="180" y2="140" stroke="#c5c6c7" stroke-width="2" />
