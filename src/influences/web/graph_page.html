<!doctype html>
<html>
<head>

<title>Influences Graph</title>
<style>

  #node-tooltip {

    z-index: 10;

    color: #f2f3f7;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    font: 600 12px Helvetica Neue, Helvetica, Arial, sans-serif;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="cy"></div>
<div id="node-tooltip"></div>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/layout-base.js"></script>
<script src="vendor/cose-base.js"></script>
<script src="vendor/cytoscape-fcose.js"></script>
<script>
  cytoscape.use(cytoscapeFcose);
</script>
<script src="graph.js"></script>

</html>
